org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Full (non-incremental) KSP so Hilt always generates every *_HiltModules class on a clean
# build — avoids the "package <VM>_HiltModules does not exist" javac error from partial rounds.
ksp.incremental=false
