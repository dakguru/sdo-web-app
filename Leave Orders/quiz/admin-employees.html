<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Employees &amp; Registrations &mdash; Quiz Administration | Karur Division</title>
<meta name="theme-color" content="#16307a" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/assets/india-post-logo.png" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/leave-orders/quiz/quiz.css">
<style>
  .subtabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .subtabs button{min-height:40px;padding:0 15px;border-radius:11px;cursor:pointer;
    font:700 13px/1 "Inter",sans-serif;background:var(--card);color:var(--muted);
    border:1px solid var(--line)}
  .subtabs button.on{background:linear-gradient(135deg,var(--indigo),var(--violet));
    color:#fff;border-color:transparent}
  .drop{border:2px dashed var(--line-2);border-radius:var(--r-lg);padding:26px 18px;text-align:center;
    background:var(--card-2);transition:border-color .2s,background .2s;cursor:pointer}
  .drop.over{border-color:var(--indigo);background:rgba(79,70,229,.06)}
  .drop .di{font-size:40px;opacity:.6}
  .maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .toolbar .input{flex:1;min-width:180px}
  .toolbar .select{max-width:200px}
  /* Registration dashboard */
  .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:9px 0 6px}
  .bar i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,var(--indigo),var(--teal))}
  .mini-row{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .mini-row b{color:var(--ink);font-variant-numeric:tabular-nums}
  .spark{display:flex;gap:7px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
  .spark-col{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .spark-col em{font-style:normal;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .spark-col .sb{width:100%;height:96px;display:flex;align-items:flex-end}
  .spark-col .sb i{display:block;width:100%;border-radius:5px 5px 2px 2px;
    background:linear-gradient(180deg,var(--indigo),var(--violet))}
  .spark-col span{font-size:10px;color:var(--muted);white-space:nowrap}
  details.card summary::-webkit-details-marker{color:var(--muted)}
</style>
</head>
<body>
<div id="shell"><main id="app"></main></div>

<script src="/leave-orders/quiz/quiz-core.js"></script>
<script src="/leave-orders/quiz/quiz-admin-core.js"></script>
<script>
(function () {
  'use strict';

  var host = null;
  var view = 'dashboard';         // dashboard | registrations | directory | import
  var parsed = null;              // the uploaded sheet, before saving
  var facets = { units: [], categories: [] };   // filter options, from the directory

  // The two prize categories, plus the bucket for anyone the roster did not
  // classify. "Unspecified" is shown rather than hidden: an employee who is in
  // neither list wins nothing, so the administrator has to be able to see them.
  var CATEGORY_LABELS = { DEPARTMENTAL: 'Departmental', GDS: 'GDS', UNSPECIFIED: 'Unspecified' };
  function catLabel(code) { return CATEGORY_LABELS[String(code || '').toUpperCase()] || 'Unspecified'; }
  function catBadge(code) {
    var c = String(code || '').toUpperCase();
    return QuizUI.badge(catLabel(c), c === 'DEPARTMENTAL' ? 'ok' : c === 'GDS' ? '' : 'mute');
  }

  QuizAdmin.boot({
    title: 'Employees & Registrations',
    subtitle: 'Divisional employee directory and quiz registrations',
    icon: '&#128101;',
    active: '/Quiz/admin/employees',
    requireRole: 'QUIZ_VIEWER',
    onReady: function (me, h) {
      host = h;
      var q = new URLSearchParams(location.search).get('view');
      if (q) view = q;
      host.innerHTML = QuizUI.skeleton(3);
      // The unit list in every filter comes from what has actually been
      // imported, so it is fetched once before the first tab is drawn. A
      // failure here is not fatal — the filters simply offer no units.
      QuizAPI.admin('registration-stats')
        .then(function (r) { facets.units = unitsOf(r); })
        .catch(function () {})
        .then(shell);
    }
  });

  function shell() {
    host.innerHTML =
      '<div class="subtabs">' +
        tabBtn('dashboard', '&#128202; Registration Dashboard') +
        tabBtn('registrations', '&#128221; Registrations') +
        tabBtn('directory', '&#128193; Employee Directory') +
        (QuizAdmin.atLeast('QUIZ_ADMIN') ? tabBtn('import', '&#11014; Import from Excel') : '') +
      '</div><div id="pane"></div>';

    Array.prototype.forEach.call(host.querySelectorAll('.subtabs button'), function (b) {
      b.addEventListener('click', function () { view = b.getAttribute('data-v'); shell(); });
    });

    if (view === 'directory') renderDirectory();
    else if (view === 'import') renderImport();
    else if (view === 'registrations') renderRegistrations();
    else renderDashboard();
  }

  /* ═══════════════════════════════════════════════════════════════
     REGISTRATION DASHBOARD

     Category-wise and unit-wise registration, each line showing the count
     against the strength on the roll. The percentage is the point of the
     page: it is what says whether a sub division still has people to chase.
     ═══════════════════════════════════════════════════════════════ */
  function renderDashboard() {
    pane().innerHTML = QuizUI.skeleton(4);
    QuizAPI.admin('registration-stats').then(function (r) {
      facets.units = unitsOf(r);
      var t = r.totals;
      var h = '';

      if (t.uncategorised) {
        h += QuizUI.alert('warn', '&#9888;',
          '<b>' + t.uncategorised + ' registration(s) carry no staff category.</b><br>' +
          'They cannot be placed in either prize list as things stand. Re-import the employee ' +
          'list with the <b>Staff Category</b> column mapped, or set the category on each ' +
          'record in the Employee Directory, then use <b>Sync from directory</b> on the ' +
          'Import tab.');
      }

      h += '<div class="grid grid-4">' +
        st2('Registered', t.registered, t.coverage == null ? '' : t.coverage + '% of the roll') +
        st2('Approved', t.approved, t.pending + ' pending approval') +
        st2('On the roll', t.eligible, 'active in the directory') +
        st2('Uncategorised', t.uncategorised, 'not in a prize list') +
      '</div>';

      // ── Category-wise ──────────────────────────────────────────
      h += '<div class="section-title">Category-wise registration</div>' +
        '<div class="grid grid-' + Math.min(3, Math.max(2, r.byCategory.length)) + '">' +
        r.byCategory.map(function (c) {
          // The "Unspecified" bucket has nobody on the roll — everyone in the
          // directory is classified — so a coverage bar for it would be a
          // division by zero dressed up as 0%. It is simply omitted.
          var known = c.eligible > 0;
          return '<div class="card" style="margin:0">' +
            '<div class="card-head"><div class="card-ic">' +
              (c.category === 'GDS' ? '&#127968;' : c.category === 'DEPARTMENTAL' ? '&#127970;' : '&#10067;') +
            '</div><div><div class="card-t">' + QuizUI.esc(catLabel(c.category)) + '</div>' +
            '<div class="card-s">' + (known
              ? c.registered + ' of ' + c.eligible + ' on the roll'
              : 'registered without a category on the roll') + '</div>' +
            '</div></div>' +
            '<div style="font:800 30px/1 \'Plus Jakarta Sans\',sans-serif;font-variant-numeric:tabular-nums">' +
              c.registered + '</div>' +
            (known ? bar(c.coverage) : '<div style="height:13px"></div>') +
            '<div class="mini-row">' +
              '<span>Approved <b>' + c.approved + '</b></span>' +
              '<span>Pending <b>' + c.pending + '</b></span>' +
              (known ? '<span>Coverage <b>' + c.coverage + '%</b></span>' : '') +
            '</div>' +
          '</div>';
        }).join('') +
      '</div>';

      // ── Unit / sub division-wise ───────────────────────────────
      h += '<div class="section-title">Unit / Sub Division-wise registration</div>' +
        '<div class="card">' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>Unit / Sub Division</th><th class="num">On roll</th><th class="num">Registered</th>' +
          '<th class="num">Departmental</th><th class="num">GDS</th>' +
          '<th class="num">Approved</th><th class="num">Pending</th><th>Coverage</th>' +
        '</tr></thead><tbody>' +
        r.byUnit.map(function (u) {
          return '<tr>' +
            '<td class="wrap"><b>' + QuizUI.esc(u.unit) + '</b></td>' +
            '<td class="num">' + u.eligible + '</td>' +
            '<td class="num"><b>' + u.registered + '</b></td>' +
            '<td class="num">' + u.departmental + '</td>' +
            '<td class="num">' + u.gds + '</td>' +
            '<td class="num">' + u.approved + '</td>' +
            '<td class="num">' + u.pending + '</td>' +
            '<td style="min-width:120px">' +
              (u.coverage == null
                ? '<span style="font-size:11px;color:var(--muted)">—</span>'
                : bar(u.coverage) + '<span style="font-size:11px;color:var(--muted)">' +
                  u.coverage + '%</span>') + '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div></div>';

      // ── Unit x category, which is the grid prize distribution needs ──
      h += '<div class="section-title">Unit &times; category</div>' +
        '<div class="card">' +
        QuizAdmin.table(['Unit / Sub Division │ Category', 'On roll', 'Registered',
                         'Approved', 'Pending', 'Coverage %'],
          r.byUnitCategory.map(function (b) {
            return [b.bucket, b.eligible, b.registered, b.approved, b.pending,
                    b.coverage == null ? '—' : b.coverage];
          }), { wrapCols: [0], numCols: [1, 2, 3, 4, 5] }) +
        '</div>';

      // ── Office-wise, kept collapsed: ~190 offices is a lot of table ──
      h += '<div class="section-title">Office-wise registration</div>' +
        '<details class="card"><summary style="cursor:pointer;font-weight:700;font-size:13.5px">' +
          'Show all ' + r.byOffice.length + ' office(s)</summary>' +
          '<div style="margin-top:13px">' +
          QuizAdmin.table(['Office', 'On roll', 'Registered', 'Approved', 'Pending', 'Coverage %'],
            r.byOffice.map(function (o) {
              return [o.office, o.eligible, o.registered, o.approved, o.pending,
                      o.coverage == null ? '—' : o.coverage];
            }), { wrapCols: [0], numCols: [1, 2, 3, 4, 5] }) +
          '</div>' +
        '</details>';

      // ── Registrations per day ──────────────────────────────────
      if (r.byDay.length) {
        var peak = Math.max.apply(null, r.byDay.map(function (d) { return d.count; }));
        h += '<div class="section-title">Registrations by day (IST)</div>' +
          '<div class="card"><div class="spark">' +
          r.byDay.map(function (d) {
            return '<div class="spark-col" title="' + QuizUI.esc(d.date + ' — ' + d.count) + '">' +
              '<em>' + d.count + '</em>' +
              '<div class="sb"><i style="height:' +
                Math.max(4, Math.round((d.count / peak) * 100)) + '%"></i></div>' +
              '<span>' + QuizUI.esc(d.date.slice(5)) + '</span></div>';
          }).join('') +
          '</div></div>';
      }

      h += '<div class="btn-row" style="margin-top:16px">' +
        '<button class="btn ghost sm" type="button" id="dxlCat">&#11015; Category-wise (Excel)</button>' +
        '<button class="btn ghost sm" type="button" id="dxlUnit">&#11015; Unit-wise (Excel)</button>' +
        '<button class="btn ghost sm" type="button" id="drefresh">Refresh</button>' +
      '</div>';

      pane().innerHTML = h;

      document.getElementById('dxlCat').addEventListener('click', function () {
        dlReport('category-registrations', 'Category-wise-Registration');
      });
      document.getElementById('dxlUnit').addEventListener('click', function () {
        dlReport('unit-registrations', 'Unit-wise-Registration');
      });
      document.getElementById('drefresh').addEventListener('click', renderDashboard);
    }).catch(function (e) {
      pane().innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  function unitsOf(stats) {
    return (stats.byUnit || []).map(function (u) { return u.unit; })
      .filter(function (u) { return u && u !== 'Unspecified'; })
      .sort();
  }

  function dlReport(kind, name) {
    QuizUI.toast('Preparing the report…');
    QuizAPI.admin('report', { kind: kind }).then(function (r) {
      QuizAdmin.exportXlsx('Quiz-' + name + '-' + stamp() + '.xlsx', r.title, r.columns, r.rows);
      QuizUI.toast(r.rows.length + ' row(s) exported.', 'ok');
    }).catch(QuizUI.err);
  }

  function bar(pct) {
    return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }

  function st2(k, v, n) {
    return '<div class="stat"><div class="k">' + QuizUI.esc(k) + '</div>' +
      '<div class="v">' + QuizUI.esc(v) + '</div>' +
      '<div class="n">' + QuizUI.esc(n) + '</div></div>';
  }

  function tabBtn(v, label) {
    return '<button type="button" data-v="' + v + '" class="' + (view === v ? 'on' : '') + '">' +
      label + '</button>';
  }

  var pane = function () { return document.getElementById('pane'); };

  /* ═══════════════════════════════════════════════════════════════
     REGISTRATIONS
     ═══════════════════════════════════════════════════════════════ */
  function renderRegistrations() {
    pane().innerHTML =
      '<div class="toolbar">' +
        '<input class="input" id="rq" placeholder="Search name, Employee ID, office, registration ID…" />' +
        '<select class="select" id="rs">' +
          '<option value="">All statuses</option>' +
          '<option value="PENDING">Pending approval</option>' +
          '<option value="APPROVED">Approved</option>' +
          '<option value="REJECTED">Rejected</option>' +
          '<option value="SUSPENDED">Suspended</option>' +
          '<option value="CANCELLED">Cancelled</option>' +
        '</select>' +
        categorySelect('rc') +
        unitSelect('ru') +
        '<button class="btn sm ghost" type="button" id="rgo">Search</button>' +
        '<button class="btn sm ghost" type="button" id="rxl">&#11015; Excel</button>' +
        (QuizAdmin.atLeast('QUIZ_ADMIN')
          ? '<button class="btn sm" type="button" id="radd">+ Add manually</button>' +
            '<button class="btn sm ok" type="button" id="rbulk">Approve all pending</button>'
          : '') +
      '</div>' +
      '<div id="rlist">' + QuizUI.skeleton(4) + '</div>';

    document.getElementById('rgo').addEventListener('click', loadRegs);
    document.getElementById('rq').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loadRegs();
    });
    document.getElementById('rs').addEventListener('change', loadRegs);
    document.getElementById('rc').addEventListener('change', loadRegs);
    document.getElementById('ru').addEventListener('change', loadRegs);
    document.getElementById('rxl').addEventListener('click', exportRegs);

    var add = document.getElementById('radd');
    if (add) add.addEventListener('click', addManual);
    var bulk = document.getElementById('rbulk');
    if (bulk) bulk.addEventListener('click', approveAllPending);

    loadRegs();
  }

  function loadRegs() {
    var list = document.getElementById('rlist');
    list.innerHTML = QuizUI.skeleton(4);
    QuizAPI.admin('registrations-list', {
      q: document.getElementById('rq').value.trim(),
      status: document.getElementById('rs').value,
      category: document.getElementById('rc').value,
      unit: document.getElementById('ru').value,
      limit: 500,
    }).then(function (r) {
      if (!r.registrations.length) {
        list.innerHTML = QuizUI.empty('&#128221;', 'No registrations found',
          'Nobody matching these filters has registered yet. Employees appear here as soon as ' +
          'they sign in and confirm their Employee ID.');
        return;
      }

      var html = '<p style="font-size:12.5px;color:var(--muted);margin-bottom:11px">Showing ' +
        r.registrations.length + ' of ' + r.total + ' registration(s).</p>';

      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
        '<th>Registration</th><th>Employee</th><th>Designation</th><th>Category</th>' +
        '<th>Unit / Sub Division</th><th>Office</th>' +
        '<th>Sign-in</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

      r.registrations.forEach(function (x) {
        var idn = x.identity || {};
        html += '<tr>' +
          '<td><b>' + QuizUI.esc(x.reg_code) + '</b><br>' +
            '<span style="font-size:11px;color:var(--muted)">' +
            QuizUI.esc(QuizTime.ist(x.created_at_ms)) + '</span></td>' +
          '<td class="wrap"><b>' + QuizUI.esc(x.employee_name) + '</b><br>' +
            '<span style="font-family:JetBrains Mono,monospace;font-size:11.5px">' +
            QuizUI.esc(x.employee_id) + '</span></td>' +
          '<td class="wrap">' + QuizUI.esc(x.designation) + '</td>' +
          '<td>' + catBadge(x.category) + '</td>' +
          '<td class="wrap">' + QuizUI.esc(x.unit || '—') + '</td>' +
          '<td class="wrap">' + QuizUI.esc(x.office) + '</td>' +
          '<td>' + (idn.provider === 'google'
              ? QuizUI.badge('Google', 'ok') + '<br><span style="font-size:10.5px;color:var(--muted)">' +
                QuizUI.esc(idn.email || '') + '</span>'
              : QuizUI.badge(x.manual_entry ? 'Manual' : 'Employee ID', 'warn')) + '</td>' +
          '<td>' + QuizUI.statusBadge(x.status) +
            (x.remarks ? '<br><span style="font-size:10.5px;color:var(--muted)">' +
              QuizUI.esc(x.remarks) + '</span>' : '') + '</td>' +
          '<td>' + actionBtns(x) + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      list.innerHTML = html;

      Array.prototype.forEach.call(list.querySelectorAll('[data-act]'), function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-id');
          var row = r.registrations.filter(function (x) { return x.id === id; })[0];
          onAction(b.getAttribute('data-act'), id, b.getAttribute('data-name'), row);
        });
      });
    }).catch(function (e) {
      list.innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  function actionBtns(x) {
    if (!QuizAdmin.atLeast('QUIZ_ADMIN')) return '<span style="color:var(--muted);font-size:11.5px">—</span>';
    var n = QuizUI.esc(x.employee_name);
    var out = '<div style="display:flex;gap:5px;flex-wrap:wrap">';
    if (x.status !== 'APPROVED') {
      out += mini('approve', x.id, n, 'Approve', 'ok');
    }
    out += mini('category', x.id, n, 'Category', '');
    if (x.status !== 'SUSPENDED') out += mini('suspend', x.id, n, 'Suspend', '');
    if (x.status !== 'REJECTED') out += mini('reject', x.id, n, 'Reject', '');
    out += mini('unlink', x.id, n, 'Unlink', 'danger');
    out += '</div>';
    return out;
  }

  // Correcting the prize category on one registration. This is the registration's
  // OWN record, not the directory: it is what the leaderboard reads, so a fix
  // here takes effect immediately and is not undone by a later roster import.
  function editCategory(x) {
    QuizUI.modal('cmod', 'Category and unit — ' + (x.employee_name || ''),
      QuizUI.alert('', '&#8505;',
        'This changes the record this registration competes under. Use it when the roster had ' +
        'the wrong category, or the employee has moved between units. The employee directory ' +
        'is not altered; correct that separately if it is also wrong.') +
      '<div class="field"><label for="c_cat">Staff category</label>' +
        '<select class="select" id="c_cat">' +
          '<option value=""' + (!x.category ? ' selected' : '') + '>— not set —</option>' +
          '<option value="DEPARTMENTAL"' + (x.category === 'DEPARTMENTAL' ? ' selected' : '') +
            '>Departmental</option>' +
          '<option value="GDS"' + (x.category === 'GDS' ? ' selected' : '') + '>GDS</option>' +
        '</select></div>' +
      '<div class="field"><label for="c_unit">Unit / Sub Division</label>' +
        '<input class="input" id="c_unit" list="unitList" value="' +
          QuizUI.esc(x.unit || '') + '" placeholder="e.g. Karur Sub Division" />' +
        unitDatalist() + '</div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'cmod\')">Cancel</button>' +
      '<button class="btn" type="button" id="cok" style="flex:1">Save</button>');

    document.getElementById('cok').addEventListener('click', function () {
      QuizAPI.admin('registration-edit', null, {
        id: x.id,
        category: document.getElementById('c_cat').value,
        unit: document.getElementById('c_unit').value.trim(),
      }).then(function () {
        QuizUI.closeModal('cmod');
        QuizUI.toast('Registration updated.', 'ok');
        loadRegs();
      }).catch(QuizUI.err);
    });
  }

  /* ── Shared filter controls ───────────────────────────────────── */
  function categorySelect(id, label) {
    return '<select class="select" id="' + id + '">' +
      '<option value="">' + (label || 'All categories') + '</option>' +
      '<option value="DEPARTMENTAL">Departmental</option>' +
      '<option value="GDS">GDS</option>' +
      '<option value="UNSPECIFIED">Unspecified</option>' +
    '</select>';
  }

  function unitSelect(id) {
    return '<select class="select" id="' + id + '">' +
      '<option value="">All units / sub divisions</option>' +
      facets.units.map(function (u) {
        return '<option value="' + QuizUI.esc(u) + '">' + QuizUI.esc(u) + '</option>';
      }).join('') +
    '</select>';
  }

  function unitDatalist() {
    return '<datalist id="unitList">' + facets.units.map(function (u) {
      return '<option value="' + QuizUI.esc(u) + '"></option>';
    }).join('') + '</datalist>';
  }

  function mini(act, id, name, label, cls) {
    return '<button class="btn sm ' + (cls === 'ok' ? 'ok' : cls === 'danger' ? 'danger' : 'ghost') +
      '" type="button" data-act="' + act + '" data-id="' + id + '" data-name="' + name + '">' +
      label + '</button>';
  }

  function onAction(act, id, name, row) {
    if (act === 'unlink') return unlink(id, name);
    if (act === 'category') return editCategory(row || { id: id, employee_name: name });
    var map = { approve: 'APPROVED', suspend: 'SUSPENDED', reject: 'REJECTED' };
    var status = map[act];
    if (!status) return;

    if (act === 'approve') {
      send(id, status, '');
      return;
    }
    // Suspending or rejecting someone deserves a recorded reason.
    QuizUI.modal('rmod', (act === 'reject' ? 'Reject' : 'Suspend') + ' registration',
      '<p style="font-size:13.5px;margin-bottom:13px">' + QuizUI.esc(name) + '</p>' +
      '<div class="field"><label for="rr">Reason (shown to the employee)</label>' +
      '<textarea class="textarea" id="rr" placeholder="e.g. Employee ID belongs to another official"></textarea></div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'rmod\')">Cancel</button>' +
      '<button class="btn danger" type="button" id="rok" style="flex:1">Confirm</button>');
    document.getElementById('rok').addEventListener('click', function () {
      var reason = document.getElementById('rr').value.trim();
      QuizUI.closeModal('rmod');
      send(id, status, reason);
    });
  }

  function unlink(id, name) {
    QuizUI.modal('umod', 'Release this Employee ID',
      QuizUI.alert('warn', '&#9888;',
        'This removes the registration so the Employee ID can be claimed again by the correct ' +
        'official. It is refused if the employee has already sat the examination, and it is ' +
        'recorded in the audit log.') +
      '<p style="font-size:13.5px;margin-bottom:13px"><b>' + QuizUI.esc(name) + '</b></p>' +
      '<div class="field"><label for="ur">Reason (required, audited)</label>' +

  function approveAllPending() {
    QuizAPI.admin('registrations-list', { status: 'PENDING', limit: 2000 }).then(function (r) {
      var ids = r.registrations.map(function (x) { return x.id; });
      if (!ids.length) { QuizUI.toast('There are no pending registrations.', 'ok'); return; }

      QuizUI.modal('bmod', 'Approve all pending registrations',
        '<p style="font-size:14px;line-height:1.6">Approve <b>' + ids.length +
        '</b> pending registration(s)? Every one of them has already matched the uploaded ' +
        'employee list. They will become eligible to sit the examination.</p>',

        '<button class="btn ok" type="button" id="bok" style="flex:1">Approve ' + ids.length + '</button>');

      document.getElementById('bok').addEventListener('click', function () {
        QuizUI.closeModal('bmod');
        QuizAPI.admin('registration-edit', null, { bulk_ids: ids, status: 'APPROVED' })
          .then(function (x) { QuizUI.toast(x.updated + ' approved.', 'ok'); loadRegs(); })

    QuizUI.modal('eed', isNew ? 'Add an employee' : 'Edit ' + (e.employee_id || ''),

        'reports stay consistent.')) +

        '<input class="input mono" id="e_id" value="' + QuizUI.esc(e.employee_id || '') + '"' +

      '<div class="field"><label for="e_name">Name</label>' +
        '<input class="input" id="e_name" value="' + QuizUI.esc(e.employee_name || '') + '" /></div>' +
      '<div class="field"><label for="e_desig">Designation</label>' +
        '<input class="input" id="e_desig" value="' + QuizUI.esc(e.designation || '') + '" /></div>' +
      '<div class="field"><label for="e_office">Office</label>' +

      '<div class="field"><label for="e_cat">Staff category</label>' +

          '<option value=""' + (!e.category ? ' selected' : '') + '>— not set —</option>' +
          '<option value="DEPARTMENTAL"' + (e.category === 'DEPARTMENTAL' ? ' selected' : '') +

          '<option value="GDS"' + (e.category === 'GDS' ? ' selected' : '') + '>GDS</option>' +

          'left unset competes in neither.</div></div>' +
      '<div class="field"><label for="e_unit">Unit / Sub Division</label>' +
        '<input class="input" id="e_unit" list="unitList" value="' + QuizUI.esc(e.unit || '') + '" ' +
        'placeholder="e.g. Karur Sub Division" />' + unitDatalist() + '</div>' +
      '<div class="field"><div class="checkrow">' +
        '<input type="checkbox" id="e_active"' + (e.active === false ? '' : ' checked') + ' />' +
        '<label for="e_active" style="font-weight:500;margin:0">Active &mdash; may register for the ' +
          'quiz. Clearing this withdraws eligibility without deleting any record.</label>' +
      '</div></div>' +
      '<div id="e_err"></div>',
      '<button class="btn ghost" type="button" id="e_cancel">Cancel</button>' +

    document.getElementById('e_cancel').addEventListener('click', function () {

  function renderImport() {
    pane().innerHTML =
      QuizUI.alert('', '&#8505;',

        'columns are <b>Employee ID</b>, <b>Name</b>, <b>Designation</b> and <b>Office</b>; ' +
        '<b>Staff Category</b> and <b>Unit/ Sub Division</b> are strongly recommended, because ' +

        'Employee IDs are stored as text so leading zeros survive.') +

      '<div class="card">' +
        '<div class="drop" id="drop" tabindex="0" role="button" ' +
          'aria-label="Choose a spreadsheet to import">' +
          '<div class="di">&#128228;</div>' +
          '<p style="font-weight:700;margin:9px 0 4px">Tap to choose a file, or drop it here</p>' +
          '<p style="font-size:12.5px;color:var(--muted);margin:0">.xlsx or .csv, up to 5000 rows</p>' +
        '</div>' +

        '<div id="mapArea" style="margin-top:16px"></div>' +

      '<div class="card">' +
        '<div class="card-head"><div class="card-ic">&#128260;</div>' +
          '<div><div class="card-t">Sync registrations from the directory</div>' +
          '<div class="card-s">Fill in category and unit on registrations that have none</div></div></div>' +
        '<p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:13px">' +
          'Employees who registered before the roster carried a staff category sit outside both ' +
          'prize lists until this is run. It copies category and unit from the employee directory ' +
          'onto their registration and onto any result already computed. <b>Nothing else is ' +
          'touched</b> &mdash; no status, no attempt, no score, and never a category an ' +
          'administrator has already set by hand.' +
        '</p>' +
        '<div class="btn-row">' +
          '<button class="btn ghost sm" type="button" id="bfill">Fill in the blanks</button>' +
          '<button class="btn ghost sm" type="button" id="bresync">Re-sync everything</button>' +
        '</div>' +
        '<span id="bfOut" style="display:block;margin-top:10px;font-size:12.5px;color:var(--muted)"></span>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-head"><div class="card-ic">&#128220;</div>' +
          '<div><div class="card-t">Recent imports</div>' +
          '<div class="card-s">Audit trail of directory uploads</div></div></div>' +
        '<div id="jobs">' + QuizUI.skeleton(2) + '</div>' +
      '</div>';

    var drop = document.getElementById('drop');
    var file = document.getElementById('file');

    drop.addEventListener('click', function () { file.click(); });
    drop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); }
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    file.addEventListener('change', function () {
      if (file.files && file.files[0]) handleFile(file.files[0]);
    });

    document.getElementById('bfill').addEventListener('click', function () { backfill(false); });
    document.getElementById('bresync').addEventListener('click', function () { backfill(true); });

  function backfill(overwrite) {
    var go = function () {
      var out = document.getElementById('bfOut');
      out.textContent = 'Working…';
      QuizAPI.admin('registrations-backfill', null, { overwrite: overwrite })
        .then(function (r) {
          out.textContent = r.message;
          QuizUI.toast(r.message, 'ok');
        }).catch(function (e) { out.textContent = ''; QuizUI.err(e); });
    };

    if (!overwrite) return go();

    // Re-syncing overwrites categories an administrator may have corrected by
    // hand, so it asks first. Filling blanks cannot lose anything and does not.
    QuizUI.modal('bfm', 'Re-sync every registration',
      QuizUI.alert('warn', '&#9888;',
        'This overwrites the category and unit on <b>every</b> registration with whatever the ' +
        'employee directory currently says &mdash; including records an administrator has ' +
        'corrected by hand. Use it only after re-importing a corrected roster. Statuses, ' +
        'attempts and scores are not affected.'),
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'bfm\')">Cancel</button>' +
      '<button class="btn danger" type="button" id="bfok" style="flex:1">Re-sync everything</button>');

    document.getElementById('bfok').addEventListener('click', function () {
      QuizUI.closeModal('bfm');
      go();
    });
  }

  function handleFile(f) {
    document.getElementById('mapArea').innerHTML = QuizUI.skeleton(2);
    QuizAdmin.readSheet(f).then(function (res) {
      parsed = { file: f, rows: res.rows, headers: res.headers };
      renderMapping();
    }).catch(function (e) {
      document.getElementById('mapArea').innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  // Flexible column mapping, pre-guessed from the header names. The Karur
  // Division sheet uses Employee_id / Employee_name / Post_desc / Office_desc,
  // which the guesser picks up without any manual selection.
  function renderMapping() {
    var hs = parsed.headers || [];
    var guess = function (patterns) {
      for (var i = 0; i < hs.length; i++) {
        var h = String(hs[i]).toLowerCase().replace(/[^a-z]/g, '');
        for (var j = 0; j < patterns.length; j++) {
          if (h.indexOf(patterns[j]) >= 0) return hs[i];
        }
      }
      return '';
    };
    // Order matters here. "Office" must be guessed from `officedesc`/`office`
    // BEFORE anything looks at `unit`, and the unit guess must not match
    // "Office_desc" — the Karur Division sheet has both "Office_desc" and
    // "Unit/ Sub Division", and swapping them would put every employee in the
    // wrong sub division.
    var g = {
      employee_id: guess(['employeeid', 'empid', 'hrms', 'staffid', 'id']),
      employee_name: guess(['employeename', 'name', 'official']),
      designation: guess(['postdesc', 'designation', 'post', 'cadre']),
      office: guess(['officedesc', 'office', 'so', 'bo']),
      unit: guess(['unitsubdivision', 'subdivision', 'unit']),
      category: guess(['staffcategory', 'category', 'cadretype', 'employeetype']),
    };

    var opts = function (sel) {
      return '<option value="">— not mapped —</option>' + hs.map(function (h) {
        return '<option value="' + QuizUI.esc(h) + '"' + (h === sel ? ' selected' : '') + '>' +
          QuizUI.esc(h) + '</option>';
      }).join('');
    };

    document.getElementById('mapArea').innerHTML =
      '<p style="font-size:13px;font-weight:700;margin-bottom:11px">' +
        QuizUI.esc(parsed.file.name) + ' &mdash; ' + parsed.rows.length + ' data row(s)</p>' +
      '<div class="section-title" style="margin-top:0">Column mapping</div>' +
      mapRow('Employee ID', 'm_employee_id', opts(g.employee_id)) +
      mapRow('Name', 'm_employee_name', opts(g.employee_name)) +
      mapRow('Designation', 'm_designation', opts(g.designation)) +
      mapRow('Office', 'm_office', opts(g.office)) +
      mapRow('Staff Category', 'm_category', opts(g.category)) +
      mapRow('Unit / Sub Division', 'm_unit', opts(g.unit)) +
      '<div class="field" style="margin-top:14px">' +
        '<label for="mode">If an Employee ID already exists</label>' +
        '<select class="select" id="mode">' +
          '<option value="MERGE">Update it, and keep everyone else (recommended)</option>' +
          '<option value="REPLACE">Mark everyone inactive first, then import this file as the full list</option>' +
        '</select>' +
        '<div class="hint">Replace never deletes anybody &mdash; employees who have already registered ' +
          'or sat an examination keep their records; they are only marked inactive.</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn ghost" type="button" id="prev">Preview</button>' +
        '<button class="btn" type="button" id="save" style="flex:1">Import</button>' +
      '</div>';

    document.getElementById('prev').addEventListener('click', function () { doImport(true); });
    document.getElementById('save').addEventListener('click', function () { doImport(false); });
  }

  function mapRow(label, id, optionsHtml) {
    return '<div class="maprow">' +
      '<label for="' + id + '" style="font-size:12.5px;font-weight:700">' + QuizUI.esc(label) + '</label>' +
      '<select class="select" id="' + id + '">' + optionsHtml + '</select>' +
    '</div>';
  }

  function doImport(dryRun) {
    var pick = function (id) { return document.getElementById(id).value; };
    var m = {
      employee_id: pick('m_employee_id'),
      employee_name: pick('m_employee_name'),
      designation: pick('m_designation'),
      office: pick('m_office'),
      category: pick('m_category'),
      unit: pick('m_unit'),
    };
    if (!m.employee_id || !m.employee_name || !m.designation || !m.office) {
      QuizUI.toast('Map Employee ID, Name, Designation and Office before importing.', 'err');
      return;
    }
    // Not fatal — the directory is still usable without it — but it is worth
    // saying out loud, because the prize lists depend on it.
    if (!m.category && !dryRun) {
      QuizUI.toast('No Staff Category column mapped — nobody will be placed in a prize list.', 'err');
    }

    var rows = parsed.rows.map(function (r) {
      return {
        employee_id: r[m.employee_id],
        employee_name: r[m.employee_name],
        designation: r[m.designation],
        office: r[m.office],
        category: m.category ? r[m.category] : null,
        unit: m.unit ? r[m.unit] : null,
      };
    });

    var out = document.getElementById('impOut');
    out.innerHTML = '<div class="card">' + QuizUI.skeleton(2) + '</div>';

    QuizAPI.admin('employees-import', null, {
      rows: rows,
      mode: document.getElementById('mode').value,
      filename: parsed.file.name,
      dry_run: !!dryRun,
    }).then(function (r) {
      var s = r.summary;
      var h = '<div class="card">' +
        '<div class="card-head"><div class="card-ic">' + (dryRun ? '&#128065;' : '&#9989;') + '</div>' +
          '<div><div class="card-t">' + (dryRun ? 'Preview' : 'Import complete') + '</div>' +
          '<div class="card-s">' + QuizUI.esc(parsed.file.name) + '</div></div></div>';

      h += '<div class="grid grid-4">' +
        st('Rows in file', s.total) +
        st(dryRun ? 'Will insert' : 'Inserted', dryRun ? s.toInsert : s.inserted) +
        st(dryRun ? 'Will update' : 'Updated', dryRun ? s.toUpdate : s.updated) +
        st('Needing review', s.skipped) +
      '</div>';

      if (r.message) {
        h += '<p style="margin-top:14px;font-size:13.5px;font-weight:600">' +
          QuizUI.esc(r.message) + '</p>';
      }

      // Confirming that the two columns the prize lists depend on landed on the
      // right people is the whole reason to preview before importing.
      if (r.breakdown) {
        h += '<div class="section-title">Staff category in this file</div>' +
          QuizAdmin.table(['Category', 'Employees'],
            Object.keys(r.breakdown.byCategory).sort().map(function (k) {
              return [k === 'Unspecified' ? 'Unspecified' : catLabel(k), r.breakdown.byCategory[k]];
            }), { numCols: [1] }) +
          '<div class="section-title">Unit / Sub Division in this file</div>' +
          QuizAdmin.table(['Unit / Sub Division', 'Employees'],
            Object.keys(r.breakdown.byUnit).sort().map(function (k) {
              return [k, r.breakdown.byUnit[k]];
            }), { wrapCols: [0], numCols: [1] });
      }

      if (r.issues && r.issues.length) {
        h += '<div class="section-title">Rows requiring review</div>' +
          QuizAdmin.table(['Row', 'Employee ID', 'Issue'],
            r.issues.map(function (i) { return [i.line, i.employee_id || '—', i.issue]; }),
            { wrapCols: [2] });
      }

      if (dryRun) {
        h += '<div class="btn-row" style="margin-top:14px">' +
          '<button class="btn" type="button" id="cfm">Looks right &mdash; import now</button></div>';
      }
      h += '</div>';
      out.innerHTML = h;

      var cfm = document.getElementById('cfm');
      if (cfm) cfm.addEventListener('click', function () { doImport(false); });

      if (!dryRun) {
        QuizUI.toast(r.message || 'Import complete.', 'ok');
        loadJobs();
      }
      out.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }).catch(function (e) {
      out.innerHTML = '<div class="card">' + QuizUI.alert('err', '&#9888;',
        '<b>Import failed.</b><br>' + QuizUI.esc(e.message)) + '</div>';
    });
  }

  function st(k, v) {
    return '<div class="stat"><div class="k">' + QuizUI.esc(k) + '</div>' +
      '<div class="v">' + QuizUI.esc(v) + '</div></div>';
  }

  function loadJobs() {
    var el = document.getElementById('jobs');
    if (!el) return;
    QuizAPI.admin('import-jobs', { kind: 'EMPLOYEES' }).then(function (r) {
      if (!r.jobs.length) {
        el.innerHTML = '<p style="font-size:13px;color:var(--muted)">No directory import has been ' +
          'run yet.</p>';
        return;
      }
      el.innerHTML = QuizAdmin.table(
        ['When (IST)', 'File', 'Mode', 'Rows', 'Inserted', 'Updated', 'Review', 'By'],
        r.jobs.map(function (j) {
          return [QuizTime.ist(j.created_ms), j.filename || '—', j.mode, j.total_rows,
                  j.inserted, j.updated, j.skipped, j.created_by || ''];
        }), { numCols: [3, 4, 5, 6] });
    }).catch(function (e) {
      el.innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }
})();
</script>
</body>
</html>
