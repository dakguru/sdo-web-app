<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Question Bank &mdash; Quiz Administration | Karur Division</title>
<meta name="theme-color" content="#16307a" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/assets/india-post-logo.png" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/leave-orders/quiz/quiz.css">
<style>
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .toolbar .input{flex:1;min-width:170px}
  .toolbar .select{max-width:170px}
  .qrow{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:11px;
    background:var(--card)}
  .qrow .qh{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
  .qrow .qt{font-weight:600;font-size:14.5px;line-height:1.55;overflow-wrap:break-word}
  .qopts{display:grid;gap:5px;margin-top:10px}
  .qopt{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--card-2);display:flex;gap:9px}
  .qopt.key{background:rgba(5,150,105,.11);font-weight:700}
  .qacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .optfield{display:flex;gap:10px;align-items:center;margin-bottom:9px}
  .optfield .rad{flex:none;display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;
    min-width:62px}
  .optfield input[type=radio]{width:21px;height:21px;accent-color:var(--ok)}
  .optfield .input{flex:1}
  .drop{border:2px dashed var(--line-2);border-radius:var(--r-lg);padding:24px 18px;text-align:center;
    background:var(--card-2);cursor:pointer}
  .drop.over{border-color:var(--indigo);background:rgba(79,70,229,.06)}
  /* The set being worked on is the single most important thing on this page:
     every upload, edit and deletion below belongs to whichever one is chosen
     here, so it is given its own band rather than a slot in the toolbar. */
  .scopebar{border:1px solid var(--line);border-left:5px solid var(--indigo);
    border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px;background:var(--card)}
  .scopebar .sl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);margin-bottom:7px}
  .scopebar .srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .scopebar select{flex:1;min-width:230px}
  .scopebar .sd{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:9px}
  .scopebar .sd b{color:var(--ink)}
</style>
</head>
<body>
<div id="shell"><main id="app"></main></div>

<script src="/leave-orders/quiz/quiz-core.js"></script>
<script src="/leave-orders/quiz/quiz-admin-core.js"></script>
<script>
(function () {
  'use strict';

  var host = null;
  var parsed = null;
  var categories = [];

  // Which question set is on screen. 'ALL' is every question whoever it
  // belongs to, 'SHARED' the bank any examination may draw from, and anything
  // else the id of the examination whose own set this is. The Examinations
  // page links straight here with ?exam=<id>, which is how an administrator
  // gets to one test's paper in a single click.
  var scope = new URLSearchParams(location.search).get('exam') || 'ALL';
  var scopes = [];
  var scopeReady = true;
  var scopeKey = '';          // signature of the picker, to avoid rebuilding it

  QuizAdmin.boot({
    title: 'Question Bank',
    subtitle: 'Create, import, validate and publish examination questions',
    icon: '&#10067;',
    active: '/Quiz/admin/questions',
    requireRole: 'QUIZ_EDITOR',
    onReady: function (me, h) { host = h; shell(); }
  });

  function shell() {
    host.innerHTML =
      '<div class="scopebar" id="scopeBar"></div>' +

      // The official questions come from the administrator. Nothing is invented
      // here, and this notice stays visible so that stays clear.
      QuizUI.alert('', '&#8505;',
        '<b>Official questions are supplied by the administrator.</b> Add them one at a time below, ' +
        'or bulk-import from Excel. A question is only eligible for an examination once its status ' +
        'is <b>Active</b>, and a paper is frozen at the moment you publish the examination &mdash; ' +
        'later edits here cannot change an attempt already in progress.') +

      '<div class="toolbar">' +
        '<input class="input" id="q" placeholder="Search question text, code or category…" />' +
        '<select class="select" id="st">' +
          '<option value="">All statuses</option>' +
          '<option value="ACTIVE">Active</option>' +
          '<option value="DRAFT">Draft</option>' +
          '<option value="ARCHIVED">Archived</option>' +
        '</select>' +
        '<select class="select" id="cat"><option value="">All categories</option></select>' +
        '<button class="btn sm ghost" type="button" id="go">Search</button>' +
        '<button class="btn sm" type="button" id="add">+ Add question</button>' +
        '<button class="btn sm ghost" type="button" id="imp">&#11014; Import</button>' +
        '<button class="btn sm ghost" type="button" id="tpl">&#11015; Template</button>' +
        '<button class="btn sm ghost" type="button" id="cpy">&#128203; Copy from…</button>' +
        (QuizAdmin.atLeast('QUIZ_ADMIN')
          ? '<button class="btn sm danger" type="button" id="clr">&#128465; Clear set</button>' : '') +
      '</div>' +
      '<div id="counts" class="grid grid-4" style="margin-bottom:16px"></div>' +
      '<div id="impArea"></div>' +
      '<div id="list">' + QuizUI.skeleton(4) + '</div>';

    document.getElementById('go').addEventListener('click', load);
    document.getElementById('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') load();
    });
    document.getElementById('st').addEventListener('change', load);
    document.getElementById('cat').addEventListener('change', load);
    document.getElementById('add').addEventListener('click', function () { editor(null); });
    document.getElementById('imp').addEventListener('click', renderImport);
    document.getElementById('tpl').addEventListener('click', downloadTemplate);
    document.getElementById('cpy').addEventListener('click', copyFrom);
    var cb = document.getElementById('clr');
    if (cb) cb.addEventListener('click', clearSet);

    load();
  }

  /* ═══════════════════════════════════════════════════════════════
     SCOPE — which examination's question set is being worked on
     ═══════════════════════════════════════════════════════════════ */

  // The examination row for the current scope, or null for the shared bank
  // and the combined view.
  function currentScope() {
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i].id === scope) return scopes[i];
    }
    return null;
  }
  function isExamScope() { return scope !== 'ALL' && scope !== 'SHARED'; }

  function scopeName() {
    var s = currentScope();
    if (scope === 'ALL') return 'every question set';
    if (scope === 'SHARED') return 'the shared bank';
    return s ? s.title : 'this examination';
  }

  function renderScopeBar() {
    var bar = document.getElementById('scopeBar');
    if (!bar) return;

    // Rebuild the <select> only when the options themselves change, so that
    // reloading the list does not throw away a selection mid-interaction.
    var key = scope + '|' + scopes.map(function (s) {
      return s.id + ':' + s.ownCount + ':' + s.title;
    }).join('|');
    if (key !== scopeKey) {
      scopeKey = key;
      var opts = '<option value="ALL"' + (scope === 'ALL' ? ' selected' : '') + '>' +
        'All questions — every set together</option>';
      scopes.forEach(function (s) {
        var label = s.id === 'SHARED'
          ? s.title + ' (' + s.ownCount + ')'
          : s.title + ' — ' + s.ownCount + ' of its own' +
            (s.question_count ? ', paper needs ' + s.question_count : '');
        opts += '<option value="' + QuizUI.esc(s.id) + '"' +
          (s.id === scope ? ' selected' : '') + '>' + QuizUI.esc(label) + '</option>';
      });
      bar.innerHTML =
        '<div class="sl">Question set being edited</div>' +
        '<div class="srow"><select class="select" id="scopeSel">' + opts + '</select>' +
          (isExamScope()
            ? '<a class="btn sm ghost" href="/Quiz/admin/exams?exam=' + QuizUI.esc(scope) + '">' +
              '&#128198; Open this examination</a>' : '') +
        '</div>' +
        '<div class="sd" id="scopeDesc"></div>';
      document.getElementById('scopeSel').addEventListener('change', function () {
        scope = this.value;
        // The address bar follows the selection, so the page can be
        // bookmarked and shared on one examination's set.
        var url = scope === 'ALL' ? location.pathname
          : location.pathname + '?exam=' + encodeURIComponent(scope);
        history.replaceState(null, '', url);
        document.getElementById('impArea').innerHTML = '';
        parsed = null;
        load();
      });
    }

    var s = currentScope();
    var desc;
    if (!scopeReady) {
      desc = '<b>Separate sets per examination are not switched on yet.</b> Run ' +
        '<b>migration_v23_quiz_exam_questions.sql</b> in the Supabase SQL editor; until then ' +
        'every question lives in one shared bank, exactly as before.';
    } else if (scope === 'ALL') {
      desc = 'Showing every question in the module, whichever set it belongs to. ' +
        'Choose an examination above to upload or edit <b>its own paper</b>, separately from ' +
        'every other test.';
    } else if (scope === 'SHARED') {
      desc = 'The <b>shared bank</b>. An examination that has no questions of its own draws its ' +
        'paper from here. Anything added here is offered to every such examination.';
    } else {
      desc = 'Questions belonging to <b>' + QuizUI.esc(s ? s.title : '') + '</b> alone. ' +
        (s && s.ownCount
          ? 'Its paper is drawn <b>only</b> from this set — the shared bank is not used, and no ' +
            'other examination can reach these questions. ' +
            (s.question_count
              ? '<b>' + s.activeCount + '</b> active here, and the paper needs <b>' +
                s.question_count + '</b>.'
              : '')
          : 'This set is empty, so the examination still falls back to the shared bank. ' +
            'Upload or add questions here to give it a paper of its own.');
    }
    var box = document.getElementById('scopeDesc');
    if (box) box.innerHTML = desc;

    // "Clear set" only means anything for one examination's own questions.
    var cb = document.getElementById('clr');
    if (cb) cb.style.display = isExamScope() ? '' : 'none';
    var cp = document.getElementById('cpy');
    if (cp) cp.style.display = (scopeReady && scope !== 'ALL') ? '' : 'none';
  }

  /* ═══════════════════════════════════════════════════════════════
     LIST
     ═══════════════════════════════════════════════════════════════ */
  function load() {
    var list = document.getElementById('list');
    list.innerHTML = QuizUI.skeleton(4);

    QuizAPI.admin('questions-list', {
      q: document.getElementById('q').value.trim(),
      status: document.getElementById('st').value,
      category: document.getElementById('cat').value,
      scope: scope,
      limit: 100,
    }).then(function (r) {
      var c = r.counts;

      // The server is the authority on the scope: if migration_v23 has not
      // been run it answers 'ALL' whatever was asked for, and the bar then
      // says so rather than the page pretending to a set that cannot exist.
      scopes = r.scopes || [];
      scopeReady = r.scopeReady !== false;
      scope = r.scope || 'ALL';
      renderScopeBar();
      document.getElementById('counts').innerHTML =
        st('Total', c.total) + st('Active', c.active) + st('Draft', c.draft) + st('Archived', c.archived);

      // Keep the category filter in step with what is actually in the bank.
      if (JSON.stringify(r.categories) !== JSON.stringify(categories)) {
        categories = r.categories || [];
        var sel = document.getElementById('cat');
        var cur = sel.value;
        sel.innerHTML = '<option value="">All categories</option>' + categories.map(function (x) {
          return '<option value="' + QuizUI.esc(x) + '"' + (x === cur ? ' selected' : '') + '>' +
            QuizUI.esc(x) + '</option>';
        }).join('');
      }

      if (!c.total) {
        list.innerHTML = isExamScope()
          ? QuizUI.empty('&#128196;', 'No question paper for this examination yet',
              '<b>' + QuizUI.esc(scopeName()) + '</b> has no questions of its own, so it would ' +
              'fall back to the shared bank. Use <b>Template</b> for the exact column layout, ' +
              '<b>Import</b> to upload this test\'s paper from Excel, <b>+ Add question</b> to ' +
              'type one, or <b>Copy from…</b> to start from a set that already exists.')
          : QuizUI.empty('&#10067;', 'Question Bank Not Yet Uploaded',
              'No questions have been added yet. Use <b>+ Add question</b> for a single question, ' +
              'or <b>Import</b> to upload the question bank from Excel. ' +
              'Download the template first if you would like the exact column layout.');
        return;
      }
      if (!r.questions.length) {
        list.innerHTML = QuizUI.empty('&#128269;', 'No matching questions',
          'No question matches the current search and filters.');
        return;
      }

      list.innerHTML =
        '<p style="font-size:12.5px;color:var(--muted);margin-bottom:11px">Showing ' +
          r.questions.length + ' question(s) in ' + QuizUI.esc(scopeName()) + '.</p>' +
        r.questions.map(qCard).join('');

      Array.prototype.forEach.call(list.querySelectorAll('[data-qa]'), function (b) {
        b.addEventListener('click', function () {
          var act = b.getAttribute('data-qa');
          var id = b.getAttribute('data-id');
          var q = r.questions.filter(function (x) { return x.id === id; })[0];
          if (act === 'edit') editor(q);
          else if (act === 'dup') duplicate(id);
          else if (act === 'hist') history(id);
          else if (act === 'del') removeOne(q);
          else setStatus(id, act);
        });
      });
    }).catch(function (e) {
      list.innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  function qCard(q) {
    var opts = ['a', 'b', 'c', 'd'].map(function (k) {
      var isKey = q.correct_option === k.toUpperCase();
      return '<div class="qopt' + (isKey ? ' key' : '') + '">' +
        '<span style="flex:none;font-weight:800">' + k.toUpperCase() + '</span>' +
        '<span style="flex:1;min-width:0;overflow-wrap:break-word">' +
          QuizUI.esc(q['option_' + k]) + '</span>' +
        (isKey ? '<span style="flex:none">&#10004;</span>' : '') +
      '</div>';
    }).join('');

    return '<div class="qrow">' +
      '<div class="qh">' +
        '<b style="font-family:JetBrains Mono,monospace;font-size:12px">' +
          QuizUI.esc(q.qcode || '—') + '</b>' +
        QuizUI.statusBadge(q.status) +
        (q.category ? QuizUI.badge(q.category) : '') +
        QuizUI.badge(q.difficulty || 'MEDIUM', q.difficulty === 'HARD' ? 'warn' : 'mute') +
        // In the combined view the owning set is the thing you cannot work out
        // from the question itself, so it is named on the card.
        (scope === 'ALL' && scopeReady ? QuizUI.badge(setLabel(q.exam_id), 'mute') : '') +
        '<span style="margin-left:auto;font-size:10.5px;color:var(--muted)">v' + q.version + '</span>' +
      '</div>' +
      '<div class="qt">' + QuizUI.esc(q.question_text) + '</div>' +
      '<div class="qopts">' + opts + '</div>' +
      (q.explanation || q.source_ref
        ? '<div style="margin-top:9px;font-size:12px;color:var(--muted);line-height:1.6">' +
          (q.explanation ? QuizUI.esc(q.explanation) : '') +
          (q.source_ref ? '<br><b>Reference:</b> ' + QuizUI.esc(q.source_ref) : '') + '</div>'
        : '') +
      '<div class="qacts">' +
        btn('edit', q.id, 'Edit') +
        (q.status !== 'ACTIVE' ? btn('ACTIVE', q.id, 'Activate', 'ok') : '') +
        (q.status !== 'DRAFT' ? btn('DRAFT', q.id, 'Move to draft') : '') +
        (q.status !== 'ARCHIVED' ? btn('ARCHIVED', q.id, 'Archive') : '') +
        btn('dup', q.id, 'Duplicate') +
        btn('hist', q.id, 'History') +
        (QuizAdmin.atLeast('QUIZ_ADMIN') ? btn('del', q.id, '&#128465; Delete', 'danger') : '') +
      '</div>' +
    '</div>';
  }

  // The name of the set a question belongs to, for the combined view.
  function setLabel(examId) {
    if (!examId) return 'Shared bank';
    for (var i = 0; i < scopes.length; i++) {
      if (scopes[i].id === examId) return scopes[i].title;
    }
    return 'An examination';
  }

  function btn(act, id, label, cls) {
    return '<button class="btn sm ' +
      (cls === 'ok' ? 'ok' : cls === 'danger' ? 'danger' : 'ghost') + '" type="button" ' +
      'data-qa="' + act + '" data-id="' + id + '">' + label + '</button>';
  }

  function st(k, v) {
    return '<div class="stat"><div class="k">' + QuizUI.esc(k) + '</div>' +
      '<div class="v">' + QuizUI.esc(v) + '</div></div>';
  }

  /* ═══════════════════════════════════════════════════════════════
     EDITOR
     ═══════════════════════════════════════════════════════════════ */
  // <option> list of every set a question can be filed under.
  function scopeChoices(selected) {
    return scopes.map(function (s) {
      var label = s.id === 'SHARED' ? 'Shared bank — any examination may use it' : s.title;
      return '<option value="' + QuizUI.esc(s.id) + '"' +
        (s.id === selected ? ' selected' : '') + '>' + QuizUI.esc(label) + '</option>';
    }).join('');
  }

  function editor(q) {
    var e = q || {};
    var correct = e.correct_option || '';

    var optRow = function (k) {
      var K = k.toUpperCase();
      return '<div class="optfield">' +
        '<label class="rad"><input type="radio" name="correct" value="' + K + '"' +
          (correct === K ? ' checked' : '') + ' /> ' + K + '</label>' +
        '<input class="input" id="o_' + k + '" placeholder="Option ' + K + '" ' +
          'value="' + QuizUI.esc(e['option_' + k] || '') + '" />' +
      '</div>';
    };

    QuizUI.modal('qed', q ? 'Edit question ' + (e.qcode || '') : 'Add a question',
      '<div class="field">' +
        '<label for="qtext">Question</label>' +
        '<textarea class="textarea" id="qtext" placeholder="Type the question exactly as it should appear">' +
          QuizUI.esc(e.question_text || '') + '</textarea>' +
      '</div>' +
      '<div class="section-title" style="margin-top:4px">Options &mdash; select the correct one</div>' +
      optRow('a') + optRow('b') + optRow('c') + optRow('d') +
      '<div class="grid grid-2" style="margin-top:12px">' +
        '<div class="field"><label for="qcat">Category / topic</label>' +
          '<input class="input" id="qcat" list="catList" placeholder="e.g. Post Office Act 2023" ' +
            'value="' + QuizUI.esc(e.category || '') + '" />' +
          '<datalist id="catList">' + categories.map(function (c) {
            return '<option value="' + QuizUI.esc(c) + '"></option>'; }).join('') + '</datalist>' +
        '</div>' +
        '<div class="field"><label for="qdiff">Difficulty</label>' +
          '<select class="select" id="qdiff">' +
            ['EASY', 'MEDIUM', 'HARD'].map(function (d) {
              return '<option value="' + d + '"' +
                ((e.difficulty || 'MEDIUM') === d ? ' selected' : '') + '>' +
                d.charAt(0) + d.slice(1).toLowerCase() + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label for="qexp">Explanation (optional)</label>' +
        '<textarea class="textarea" id="qexp" placeholder="Shown only if the answer key is released">' +
          QuizUI.esc(e.explanation || '') + '</textarea></div>' +
      '<div class="field"><label for="qref">Official source / reference (optional)</label>' +
        '<input class="input" id="qref" placeholder="e.g. Rule 32, Post Office Manual Vol. VI" ' +
          'value="' + QuizUI.esc(e.source_ref || '') + '" /></div>' +
      '<div class="field"><label for="qstat">Status</label>' +
        '<select class="select" id="qstat">' +
          ['DRAFT', 'ACTIVE', 'ARCHIVED'].map(function (s) {
            return '<option value="' + s + '"' + ((e.status || 'DRAFT') === s ? ' selected' : '') + '>' +
              s.charAt(0) + s.slice(1).toLowerCase() + '</option>';
          }).join('') +
        '</select>' +
        '<div class="hint">Only <b>Active</b> questions can be drawn into an examination.</div>' +
      '</div>' +
      // Which set it belongs to, editable here so a question written against
      // the wrong test can be moved without being retyped.
      (scopeReady ? '<div class="field"><label for="qscope">Belongs to</label>' +
        '<select class="select" id="qscope">' +
          scopeChoices(q ? (e.exam_id || 'SHARED') : (scope === 'ALL' ? 'SHARED' : scope)) +
        '</select>' +
        '<div class="hint">An examination with a set of its own draws its paper <b>only</b> from ' +
          'that set. The shared bank is used by examinations that have none.</div>' +
      '</div>' : '') +
      (q ? '<div class="field"><label for="qnote">Change note (recorded in the history)</label>' +
        '<input class="input" id="qnote" placeholder="e.g. Corrected option C per Directorate letter" /></div>' : '') +
      '<div id="qerr"></div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'qed\')">Cancel</button>' +
      '<button class="btn" type="button" id="qsave" style="flex:1">' +
        (q ? 'Save changes' : 'Add question') + '</button>');

    document.getElementById('qsave').addEventListener('click', function () {
      var pickedRadio = document.querySelector('input[name="correct"]:checked');
      var payload = {
        id: q ? q.id : undefined,
        question_text: document.getElementById('qtext').value,
        option_a: document.getElementById('o_a').value,
        option_b: document.getElementById('o_b').value,
        option_c: document.getElementById('o_c').value,
        option_d: document.getElementById('o_d').value,
        correct_option: pickedRadio ? pickedRadio.value : '',
        category: document.getElementById('qcat').value,
        difficulty: document.getElementById('qdiff').value,
        explanation: document.getElementById('qexp').value,
        source_ref: document.getElementById('qref').value,
        status: document.getElementById('qstat').value,
        change_note: q ? document.getElementById('qnote').value : undefined,
      };
      var sc = document.getElementById('qscope');
      if (sc) payload.scope = sc.value;

      var b = this;
      b.disabled = true; b.textContent = 'Saving…';
      QuizAPI.admin('question-save', null, payload).then(function (r) {
        QuizUI.closeModal('qed');
        QuizUI.toast(r.notice || r.duplicateWarning || 'Question saved.',
          (r.notice || r.duplicateWarning) ? '' : 'ok');
        load();
      }).catch(function (err) {
        b.disabled = false; b.textContent = q ? 'Save changes' : 'Add question';
        document.getElementById('qerr').innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(err.message));
      });
    });
  }

  function setStatus(id, status) {
    QuizAPI.admin('question-status', null, { id: id, status: status })
      .then(function () { QuizUI.toast('Status updated.', 'ok'); load(); })
      .catch(QuizUI.err);
  }

  function duplicate(id) {
    QuizAPI.admin('question-duplicate', null, { id: id })
      .then(function (r) { QuizUI.toast('Duplicated as ' + r.qcode + ' (draft).', 'ok'); load(); })
      .catch(QuizUI.err);
  }

  /* ═══════════════════════════════════════════════════════════════
     SET-LEVEL ACTIONS
     Starting one test's paper from another, emptying a set that was
     uploaded by mistake, and removing a single question outright.
     ═══════════════════════════════════════════════════════════════ */

  // Copy a whole set into the one on screen. This is how a new test's paper
  // is normally started: from last year's, or from the shared bank.
  function copyFrom() {
    var others = scopes.filter(function (s) { return s.id !== scope; });
    if (!others.length) {
      QuizUI.toast('There is no other question set to copy from yet.', '');
      return;
    }
    QuizUI.modal('qcp', 'Copy questions into ' + scopeName(),
      QuizUI.alert('', '&#128203;',
        'Every question in the set you choose is copied into <b>' + QuizUI.esc(scopeName()) +
        '</b> as a <b>draft</b>, for you to review and activate. The original set is not ' +
        'touched, and a question already present here is left alone rather than copied twice.') +
      '<div class="field"><label for="cpFrom">Copy from</label>' +
        '<select class="select" id="cpFrom">' +
          others.map(function (s) {
            var label = s.id === 'SHARED' ? 'Shared bank' : s.title;
            return '<option value="' + QuizUI.esc(s.id) + '">' +
              QuizUI.esc(label + ' — ' + s.ownCount + ' question(s)') + '</option>';
          }).join('') +
        '</select></div>' +
      '<div id="cperr"></div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'qcp\')">Cancel</button>' +
      '<button class="btn" type="button" id="cpgo" style="flex:1">Copy questions</button>');

    document.getElementById('cpgo').addEventListener('click', function () {
      var b = this;
      var from = document.getElementById('cpFrom').value;
      b.disabled = true; b.textContent = 'Copying…';

      // The ids are fetched here rather than on the server so that the copy
      // is of exactly the set the administrator was shown.
      QuizAPI.admin('questions-list', { scope: from, limit: 500 }).then(function (r) {
        var ids = (r.questions || []).map(function (q) { return q.id; });
        if (!ids.length) throw new Error('That set has no questions to copy.');
        return QuizAPI.admin('question-duplicate', null, { ids: ids, into: scope });
      }).then(function (r) {
        QuizUI.closeModal('qcp');
        QuizUI.toast(r.message, 'ok');
        load();
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Copy questions';
        document.getElementById('cperr').innerHTML =
          QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
      });
    });
  }

  // Empty this examination's set. Questions already frozen into a published
  // paper are kept by the server and reported back; a result refers to them.
  function clearSet() {
    if (!isExamScope()) return;
    var s = currentScope();
    var n = s ? s.ownCount : 0;
    if (!n) { QuizUI.toast('This set is already empty.', ''); return; }

    QuizUI.modal('qclr', 'Clear the question set',
      QuizUI.alert('err', '&#9888;',
        'This deletes <b>' + n + ' question(s)</b> belonging to <b>' +
        QuizUI.esc(scopeName()) + '</b>. It cannot be undone.<br><br>' +
        'Any question already frozen into a published paper is <b>kept</b> — a result refers ' +
        'to it and the evaluation record has to stay readable. Those are reported back to you.' +
        '<br><br>With the set empty, this examination falls back to the shared bank again.') +
      '<div class="field"><label for="clrCfm">Type <b>CLEAR</b> to confirm</label>' +
        '<input class="input" id="clrCfm" placeholder="CLEAR" autocomplete="off" /></div>' +
      '<div id="clrerr"></div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'qclr\')">Cancel</button>' +
      '<button class="btn danger" type="button" id="clrgo" style="flex:1">Delete these questions</button>');

    document.getElementById('clrgo').addEventListener('click', function () {
      var b = this;
      if (document.getElementById('clrCfm').value.trim().toUpperCase() !== 'CLEAR') {
        document.getElementById('clrerr').innerHTML =
          QuizUI.alert('err', '&#9888;', 'Type CLEAR to confirm.');
        return;
      }
      b.disabled = true; b.textContent = 'Deleting…';
      QuizAPI.admin('questions-list', { scope: scope, limit: 500 }).then(function (r) {
        var ids = (r.questions || []).map(function (q) { return q.id; });
        if (!ids.length) throw new Error('This set has no questions to delete.');
        return QuizAPI.admin('questions-delete', null, { ids: ids });
      }).then(function (r) {
        QuizUI.closeModal('qclr');
        QuizUI.toast(r.message, r.kept ? '' : 'ok');
        load();
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Delete these questions';
        document.getElementById('clrerr').innerHTML =
          QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
      });
    });
  }

  function removeOne(q) {
    QuizUI.modal('qdel', 'Delete question ' + (q.qcode || ''),
      QuizUI.alert('err', '&#9888;',
        'This removes the question permanently. <b>Archiving</b> is usually the better course ' +
        'and keeps it out of every paper while leaving the record intact.<br><br>' +
        'If it is already frozen into a published paper it will be kept, not deleted.') +
      '<div class="rev" style="border-left:4px solid var(--line-2)">' +
        '<div class="rq">' + QuizUI.esc(q.question_text) + '</div></div>' +
      '<div id="qderr"></div>',
      '<button class="btn ghost" type="button" onclick="QuizUI.closeModal(\'qdel\')">Cancel</button>' +
      '<button class="btn danger" type="button" id="qdgo" style="flex:1">Delete permanently</button>');

    document.getElementById('qdgo').addEventListener('click', function () {
      var b = this;
      b.disabled = true; b.textContent = 'Deleting…';
      QuizAPI.admin('questions-delete', null, { id: q.id }).then(function (r) {
        QuizUI.closeModal('qdel');
        QuizUI.toast(r.message, r.kept ? '' : 'ok');
        load();
      }).catch(function (e) {
        b.disabled = false; b.textContent = 'Delete permanently';
        document.getElementById('qderr').innerHTML =
          QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
      });
    });
  }

  function history(id) {
    QuizUI.modal('qh', 'Modification history', QuizUI.skeleton(3), '');
    QuizAPI.admin('question-history', { id: id }).then(function (r) {
      var box = document.querySelector('#qh .modal-body');
      if (!r.revisions.length) {
        box.innerHTML = '<p style="font-size:13.5px;color:var(--muted)">This question has not been ' +
          'edited since it was created.</p>';
        return;
      }
      box.innerHTML = r.revisions.map(function (v) {
        var s = v.snapshot || {};
        return '<div class="rev" style="border-left:4px solid var(--indigo)">' +
          '<div style="display:flex;gap:9px;align-items:center;margin-bottom:7px">' +
            QuizUI.badge('v' + v.version) +
            '<span style="font-size:11.5px;color:var(--muted)">' +
              QuizUI.esc(QuizTime.ist(v.changed_at_ms)) + ' &middot; ' +
              QuizUI.esc(v.changed_by || '') + '</span>' +
          '</div>' +
          (v.change_note ? '<p style="font-size:12.5px;font-style:italic;margin-bottom:7px">' +
            QuizUI.esc(v.change_note) + '</p>' : '') +
          '<div class="rq">' + QuizUI.esc(s.question_text || '') + '</div>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-top:6px">Key: <b>' +
            QuizUI.esc(s.correct_option || '') + '</b></div>' +
        '</div>';
      }).join('');
    }).catch(function (e) {
      document.querySelector('#qh .modal-body').innerHTML =
        QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  /* ═══════════════════════════════════════════════════════════════
     IMPORT / TEMPLATE
     ═══════════════════════════════════════════════════════════════ */
  function downloadTemplate() {
    var columns = ['question_text', 'option_a', 'option_b', 'option_c', 'option_d',
                   'correct_option', 'explanation', 'source_ref', 'category', 'difficulty'];
    var sample = [[
      'In which year did the Post Office Act come into force?',
      '2021', '2022', '2023', '2024',
      'C',
      'The Post Office Act, 2023 replaced the Indian Post Office Act, 1898.',
      'Post Office Act, 2023',
      'Post Office Act 2023',
      'MEDIUM'
    ]];
    // Named after the set it is meant for, so that three downloaded templates
    // for three different tests do not all arrive as the same filename.
    var tag = isExamScope()
      ? scopeName().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48)
      : 'Question-Bank';
    QuizAdmin.exportXlsx('Quiz-' + tag + '-Template.xlsx', 'Questions', columns, sample);
    QuizUI.toast('Template downloaded for ' + scopeName() +
      '. Replace the sample row with your questions.', 'ok');
  }

  function renderImport() {
    var area = document.getElementById('impArea');
    area.innerHTML =
      '<div class="card">' +
        '<div class="card-head"><div class="card-ic">&#11014;</div>' +
          '<div><div class="card-t">Import questions into ' + QuizUI.esc(scopeName()) + '</div>' +
          '<div class="card-s">.xlsx or .csv, up to 2000 questions per batch</div></div></div>' +
        // Where the upload will land, stated above the drop zone rather than
        // after the fact — an import into the wrong test is tedious to undo.
        (isExamScope()
          ? QuizUI.alert('ok', '&#128196;',
              'These questions will belong to <b>' + QuizUI.esc(scopeName()) + '</b> alone. ' +
              'No other examination can draw on them, and this examination\'s paper will be ' +
              'drawn only from this set.')
          : QuizUI.alert('warn', '&#9888;',
              'These questions will go into <b>the shared bank</b>, which every examination ' +
              'without a set of its own draws from. To upload a paper for one test only, ' +
              'choose that examination at the top of the page first.')) +
        QuizUI.alert('', '&#8505;',
          'Required columns: <b>question_text</b>, <b>option_a</b> to <b>option_d</b> and ' +
          '<b>correct_option</b> (A, B, C or D). Optional: explanation, source_ref, category, ' +
          'difficulty. Download the <b>Template</b> for the exact layout. Rows with a blank option, ' +
          'two identical options or a missing key are reported rather than imported.') +
        '<div class="drop" id="qdrop" tabindex="0" role="button">' +
          '<div style="font-size:38px;opacity:.6">&#128228;</div>' +
          '<p style="font-weight:700;margin:9px 0 4px">Tap to choose a file, or drop it here</p>' +
        '</div>' +
        '<input type="file" id="qfile" accept=".xlsx,.xls,.csv" hidden />' +
        '<div id="qimpOut" style="margin-top:14px"></div>' +
      '</div>';

    var drop = document.getElementById('qdrop');
    var file = document.getElementById('qfile');
    drop.addEventListener('click', function () { file.click(); });
    drop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); }
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
    });
    file.addEventListener('change', function () {
      if (file.files && file.files[0]) pick(file.files[0]);
    });
    area.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function pick(f) {
    var out = document.getElementById('qimpOut');
    out.innerHTML = QuizUI.skeleton(2);
    QuizAdmin.readSheet(f).then(function (res) {
      parsed = { file: f, rows: res.rows };
      out.innerHTML =
        '<p style="font-size:13px;font-weight:700;margin-bottom:11px">' +
          QuizUI.esc(f.name) + ' &mdash; ' + res.rows.length + ' row(s)</p>' +
        '<div class="field"><div class="checkrow">' +
          '<input type="checkbox" id="activate" />' +
          '<label for="activate" style="font-weight:500;margin:0">Mark imported questions as ' +
            '<b>Active</b> immediately (otherwise they arrive as Draft for review)</label>' +
        '</div></div>' +
        '<div class="btn-row">' +
          '<button class="btn ghost" type="button" id="qprev">Preview</button>' +
          '<button class="btn" type="button" id="qsave2" style="flex:1">Import into ' +
            QuizUI.esc(scopeName()) + '</button>' +
        '</div>' +
        '<div id="qres" style="margin-top:14px"></div>';

      document.getElementById('qprev').addEventListener('click', function () { doImport(true); });
      document.getElementById('qsave2').addEventListener('click', function () { doImport(false); });
    }).catch(function (e) {
      out.innerHTML = QuizUI.alert('err', '&#9888;', QuizUI.esc(e.message));
    });
  }

  function doImport(dryRun) {
    var res = document.getElementById('qres');
    res.innerHTML = QuizUI.skeleton(2);

    QuizAPI.admin('questions-import', null, {
      rows: parsed.rows,
      filename: parsed.file.name,
      scope: scope === 'ALL' ? 'SHARED' : scope,
      activate: document.getElementById('activate').checked,
      dry_run: !!dryRun,
    }).then(function (r) {
      var s = r.summary;
      var h = '<div class="grid grid-4">' +
        stt('Rows', s.total) +
        stt(dryRun ? 'Will import' : 'Imported', dryRun ? s.toInsert : s.inserted) +
        stt('Duplicates', s.duplicates) +
        stt('Needing review', s.skipped) +
      '</div>';
      if (r.message) {
        h += '<p style="margin-top:13px;font-size:13.5px;font-weight:600">' +
          QuizUI.esc(r.message) + '</p>';
      }
      if (r.issues && r.issues.length) {
        h += '<div class="section-title">Rows requiring review</div>' +
          QuizAdmin.table(['Row', 'Issue'],
            r.issues.map(function (i) { return [i.line, i.issue]; }), { wrapCols: [1] });
      }
      if (dryRun) {
        h += '<div class="btn-row" style="margin-top:13px">' +
          '<button class="btn" type="button" id="qcfm">Looks right &mdash; import now</button></div>';
      }
      res.innerHTML = h;

      var c = document.getElementById('qcfm');
      if (c) c.addEventListener('click', function () { doImport(false); });
      if (!dryRun) {
        QuizUI.toast(r.message, 'ok');
        load();
      }
    }).catch(function (e) {
      res.innerHTML = QuizUI.alert('err', '&#9888;', '<b>Import failed.</b><br>' + QuizUI.esc(e.message));
    });
  }

  function stt(k, v) {
    return '<div class="stat"><div class="k">' + QuizUI.esc(k) + '</div>' +
      '<div class="v">' + QuizUI.esc(v) + '</div></div>';
  }
})();
</script>
</body>
</html>
